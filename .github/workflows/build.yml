
name: Build Lazzy Manager V2

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -name "*.zip" -print -quit)
          if [ -z "$ZIP" ]; then
            echo "Source ZIP not found!"
            exit 1
          fi
          mkdir extracted
          unzip -o "$ZIP" -d extracted
          cp -R extracted/. .
          rm -rf extracted

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LazzyManager-V2-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
